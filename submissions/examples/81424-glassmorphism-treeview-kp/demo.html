<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Treeview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell" aria-labelledby="tree-title">
    <section class="panel">
      <p class="eyebrow">File Explorer</p>
      <h1 id="tree-title">Glassmorphism Treeview</h1>
      <p class="intro">Expandable project folders with translucent layers, status dots, and smooth disclosure motion.</p>
      <nav class="tree" aria-label="Project tree">
        <details open>
          <summary><span class="folder"></span> Product Suite</summary>
          <details open>
            <summary><span class="folder accent"></span> Dashboard</summary>
            <a href="#"><span class="file live"></span> analytics-overview.html</a>
            <a href="#"><span class="file"></span> revenue-widget.css</a>
          </details>
          <details>
            <summary><span class="folder mint"></span> Automation</summary>
            <a href="#"><span class="file live"></span> trigger-flow.html</a>
            <a href="#"><span class="file"></span> schedule-card.css</a>
          </details>
          <a href="#"><span class="file"></span> README.md</a>
        </details>
      </nav>
    </section>
  </main>
</body>
</html>
